<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plush Keychain 360</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f2f7; font-family: system-ui, sans-serif; }
  #hint { position: fixed; left: 16px; bottom: 16px; color: #5a4a57; font-size: 14px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="hint">Drag to orbit · scroll to zoom · auto-rotates when idle</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f2f7);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.001, 10);
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1, 2, 2); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.2); fill.position.set(-1, 1, -2); scene.add(fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 2.0;
controls.addEventListener('start', () => controls.autoRotate = false);

new GLTFLoader().load('./plush_keychain.glb', (gltf) => {
  scene.add(gltf.scene);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.set(center.x, center.y + size * 0.15, center.z + size * 1.4);
  camera.near = size / 100; camera.far = size * 20; camera.updateProjectionMatrix();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
